<main id="main-content">

    <section class="birth-chart-form">
        <h2>Create Your Birth Chart</h2>

        <p>Enter your birth details below.</p>

        <form>

            <label for="name">Your name:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="birthdate">Date of birth:</label><br>
            <input type="date" id="birthdate" name="birthdate"><br><br>

            <label for="birthtime">Time of birth:</label><br>
            <input type="time" id="birthtime" name="birthtime"><br><br>

            <label for="birthplace">Place of birth:</label><br>
            <input type="text" id="birthplace" name="birthplace"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <input type="submit" value="Create Birth Chart">

        </form>

    </section>
